# Sliding Task B — full (7 mu × 100 ep = 700) — PREREGISTERED
# See docs/SECOND_TASK_SLIDING_PREREG.md

run_id: sliding_contact_configuration_full
task_mode: sliding
geometry: cylinder
output_dir: results/phase1/second_task_recovery/sliding/full/characterization

collection:
  episodes_per_u: 100
  base_seed: 5000

sweep:
  offset_frame: world
  approach_eccentricity_m: 0.020
  friction_mu_levels: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  mass_scales: [1.0]
  tangential_effort: [0.10]

env:
  probe_budget: 10
  prediction_steps: 40

controller:
  tangential_axis: 1
  normal_axis: 0
  normal_magnitude: 0.10
  tangential_effort: 0.10
  ramp_steps: 6
  hold_steps: 20
  settle_steps: 6

characterization:
  snapshots: [approach_end, first_contact, peak_push]
  family: push
  min_contact_multiplicity: 1
  cv_stable_threshold: 0.15
  pca_variance_target: 0.90
