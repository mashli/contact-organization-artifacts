# Block push — full cross-geometry cohort (100 eps / u)
# Cross-geometry validation: block geometry under identical protocol as cylinder/sphere
# Preregistration: configs/cross_geometry_PREREG.yaml

run_id: block_contact_configuration
geometry: block
output_dir: results/phase1/characterization_block/full

collection:
  episodes_per_u: 100
  base_seed: 8000   # disjoint from cylinder (2000/7000) and sphere (3000)

sweep:
  offset_frame: world
  push_eccentricity_m: [0.0, 0.005, 0.010, 0.015, 0.020, 0.025, 0.030]
  mass_scales: [1.0]
  friction_mu: [0.6]
  impulse_magnitude: [0.20]   # block: 0.09×0.03m, comparable to cylinder impulse

env:
  probe_budget: 8
  prediction_steps: 40

controller:
  primary_axis: 0
  ramp_steps: 6
  hold_steps: 8
  settle_steps: 10

characterization:
  snapshots: [approach_end, first_contact, peak_push]
  family: push
  min_contact_multiplicity: 1
