# Inventory freeze for Section 6. Paths resolve via scripts/robotica/_paths.py
# against data/robotica/*.json.gz in this public artifacts repo.
# Legacy results/phase1/... strings remain accepted as aliases.

policy: existing_trajectories_only
new_cohort: false
missing_ok: false

geometries:
  cylinder:
    path: data/robotica/cylinder.json.gz
    legacy_path: results/phase1/landscape_analysis/landscape_trajectories.json
    n_episodes: 179
    unique_episode_ids: true
    frames_per_episode: 2-8
    basin_labels: [grazing, loaded]
    feature_schema: formation_scalar_dict
    has_fx: true
    has_protocol_phase: true
    role: qualified_positive_reference

  ellipsoid:
    path: data/robotica/ellipsoid.json.gz
    legacy_path: results/phase1/cross_geometry_recovery/ellipsoid/full/landscape_trajectories.json
    n_episodes: 300
    unique_episode_ids: true
    frames_per_episode: 60
    basin_labels: [grazing, loaded]
    feature_schema: continuous_state_dict
    has_fx: true
    has_protocol_phase: false
    phase_field: phase
    role: qualified_positive_transfer
    note: >
      Preregistered role is not the signature verdict. Signature round returns
      Sig=bot for ellipsoid under the frozen shell.

  sphere:
    path: data/robotica/sphere.json.gz
    legacy_path: results/phase1/cross_geometry_recovery/sphere/full/landscape_trajectories.json
    n_episodes: 237
    unique_episode_ids: true
    frames_per_episode: 2-8
    basin_labels: [grazing, loaded]
    feature_schema: formation_scalar_dict
    has_fx: true
    has_protocol_phase: false
    role: qualification_failure_retained

  block:
    path: data/robotica/block.json.gz
    legacy_path: results/phase1/characterization_block/full/landscape_trajectories.json
    n_episodes: 700
    unique_episode_ids: true
    frames_per_episode: 48
    basin_labels: [grazing, loaded]
    feature_schema: unnamed_feature_list_9
    has_fx: true
    has_protocol_phase: false
    role: qualification_failure_or_boundary_retained
