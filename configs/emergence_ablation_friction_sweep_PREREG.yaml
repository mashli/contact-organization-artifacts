# Emergence Physics Ablation — friction sweep (9 arms, pilot scale 10 eps/u)
# Missing arms to complete the full μ ∈ [0.2, 1.0] sweep on top of existing pilots

run_id: emergence_ablation_friction_sweep
geometry: cylinder
ablation_axis: friction_mu
reference_mu: 0.6

arms:
  - tag: friction_mu_0.20
    friction_mu: 0.20
  - tag: friction_mu_0.30
    friction_mu: 0.30
  - tag: friction_mu_0.40
    friction_mu: 0.40
  - tag: friction_mu_0.50
    friction_mu: 0.50
  - tag: friction_mu_0.60
    friction_mu: 0.60
  - tag: friction_mu_0.70
    friction_mu: 0.70
  - tag: friction_mu_0.80
    friction_mu: 0.80
  - tag: friction_mu_0.90
    friction_mu: 0.90
  - tag: friction_mu_1.00
    friction_mu: 1.00

collection:
  episodes_per_u: 10
  base_seed: 9000

sweep:
  offset_frame: world
  push_eccentricity_m: [0.0, 0.005, 0.010, 0.015, 0.020, 0.025, 0.030]
  mass_scales: [1.0]
  impulse_magnitude: [0.15]

env:
  probe_budget: 8
  prediction_steps: 40
  fx_threshold: 8.0

controller:
  primary_axis: 0
  ramp_steps: 6
  hold_steps: 8
  settle_steps: 10
  impulse_magnitude: 0.15

characterization:
  snapshots: [approach_end, first_contact, peak_push]
  family: push
  min_contact_multiplicity: 1

output_root: results/phase1/friction_sweep
